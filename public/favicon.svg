<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#orbGrad)" stroke-width="6" opacity="0.7" />

  <!-- Outer Soundwaves -->
  <path d="M 120 200 A 70 70 0 0 0 120 312" fill="none" stroke="#A78BFA" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <path d="M 88 170 A 110 110 0 0 0 88 342" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" opacity="0.6" />
  <path d="M 392 200 A 70 70 0 0 1 392 312" fill="none" stroke="#A78BFA" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <path d="M 424 170 A 110 110 0 0 1 424 342" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" opacity="0.6" />

  <!-- Center Orb -->
  <circle cx="256" cy="256" r="88" fill="url(#orbGrad)" filter="url(#glow)" opacity="0.85" />

  <!-- Mic Capsule -->
  <rect x="226" y="160" width="60" height="110" rx="30" fill="url(#micGrad)" />
  <!-- Mic Stand Arc -->
  <path d="M 200 230 A 56 56 0 0 0 312 230" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <!-- Mic Stem -->
  <line x1="256" y1="286" x2="256" y2="330" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <!-- Mic Base -->
  <line x1="216" y1="330" x2="296" y2="330" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

  <!-- Sparkle -->
  <path d="M 360 110 Q 360 135 385 135 Q 360 135 360 160 Q 360 135 335 135 Q 360 135 360 110 Z" fill="#FACC15" />
</svg>
